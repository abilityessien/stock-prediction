<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - {{ username }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">
                <i class="bi bi-house-door"></i> Dashboard
            </a>
            <div class="navbar-nav ms-auto">
                <a href="{{ url_for('logout') }}" class="nav-link">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-success text-white text-center">
                        <h2>Welcome back, {{ username }}!</h2>
                        <p class="mb-0">You are successfully logged in</p>
                    </div>
                    <div class="card-body text-center p-5">
                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <div class="card bg-primary text-white h-100">
                                    <div class="card-body">
                                        <h4>User ID: {{ session.id }}</h4>
                                        <p>Session Active</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6 mb-4">
                                <div class="card bg-info text-white h-100">
                                    <div class="card-body">
                                        <h4>Status</h4>
                                        <p>Logged in as: {{ username }}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Quick actions -->
                        <div class="mt-4">
                            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-primary btn-lg me-2">Dashboard</a>
                            <a href="{{ url_for('predict') }}" class="btn btn-warning btn-lg me-2">Predict📈</a> 
                            <a href="{{ url_for('logout') }}" class="btn btn-outline-danger btn-lg">Logout</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
