<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Stock Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-slate-700/50 p-6 text-center border-b border-slate-700">
            <h2 class="text-2xl font-bold text-white">Create Account</h2>
            <p class="text-sm text-slate-400">Join to start forecasting stocks</p>
        </div>

        <div class="p-6 space-y-4">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="p-4 rounded-lg text-sm font-medium {% if category == 'danger' %} bg-red-500/10 border border-red-500/30 text-red-400 {% else %} bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 {% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Username</label>
                    <input type="text" name="username" placeholder="Choose a username" pattern="[A-Za-z0-9]{3,}" title="Minimum 3 characters, alphanumeric" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
                    <input type="password" name="password" placeholder="Minimum 6 characters" minlength="6" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-emerald-500">
                </div>

                <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg transition duration-200">
                    Register Account
                </button>
            </form>

            <div class="text-center pt-2">
                <p class="text-sm text-slate-400">Already have an account? <a href="{{ url_for('login') }}" class="text-emerald-400 hover:underline">Login here</a></p>
            </div>
        </div>
    </div>
</body>
</html>
