<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 text-center">
                <h1 class="display-4 fw-bold text-primary mb-4">Welcome To Stock Management System Web App</h1>
                <p class="lead mb-5">Please choose an option to continue</p>
                
                <div class="row g-4">
                    <div class="col-md-6">
                        <a href="{{ url_for('register') }}" class="btn btn-success btn-lg w-100 h-100 p-4">
                            <h3>Create Account</h3>
                            <p class="mb-0">New user? Sign up here</p>
                        </a>
                    </div>
                    <div class="col-md-6">
                        <a href="{{ url_for('login') }}" class="btn btn-primary btn-lg w-100 h-100 p-4">
                            <h3>Login</h3>
                            <p class="mb-0">Have an account? Sign in</p>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
