<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Stock Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-slate-700/50 p-6 text-center border-b border-slate-700">
            <h2 class="text-2xl font-bold text-white">Welcome Back</h2>
            <p class="text-sm text-slate-400">Sign in with your credentials</p>
        </div>

        <div class="p-6 space-y-4">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="p-4 rounded-lg text-sm font-medium flex items-center justify-between {% if category == 'danger' %} bg-red-500/10 border border-red-500/30 text-red-400 {% elif category == 'success' %} bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 {% else %} bg-blue-500/10 border border-blue-500/30 text-blue-400 {% endif %}">
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Username</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3 top-3 text-slate-500"></i>
                        <input type="text" name="username" placeholder="Enter username" required class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3 top-3 text-slate-500"></i>
                        <input type="password" name="password" placeholder="Enter password" required class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg transition duration-200">
                    Sign In
                </button>
            </form>

            <div class="text-center pt-2">
                <p class="text-sm text-slate-400">Don't have an account? <a href="{{ url_for('register') }}" class="text-blue-400 hover:underline">Register</a></p>
            </div>
        </div>
    </div>
</body>
</html>
